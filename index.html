(function(){
    window.copy = function(btn, url) {
        var full = url;
        if (!/^(https?:|sub:)/i.test(url)) {
            full = location.origin + (url.charAt(0) === '/' ? '' : '/') + url;
        }
        var done = function(){ btn.classList.remove('success'); btn.textContent = '复制链接'; };
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(full).then(function(){
                btn.classList.add('success'); btn.textContent = '复制成功';
                setTimeout(done, 1500);
            }, function(){ fallback(); });
        } else {
            fallback();
        }
        function fallback(){
            var ta = document.createElement('textarea');
            ta.value = full; document.body.appendChild(ta); ta.select();
            try { document.execCommand('copy'); btn.classList.add('success'); btn.textContent = '复制成功'; }
            catch(e) { prompt('复制链接', full); }
            document.body.removeChild(ta); setTimeout(done, 1500);
        }
    };
})();
