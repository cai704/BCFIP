name: cmliu2

on:
  schedule:
    - cron: '6 */6 * * *'
  workflow_dispatch:

jobs:
  fetch_and_push:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 请求订阅并校验数据
        run: |
          echo "开始镜像参考源数据 (wanwushequ/cfyxip) ..."
          mkdir -p cmliu2
          if ! curl -sL --retry 3 --retry-delay 3 "https://raw.githubusercontent.com/wanwushequ/cfyxip/main/cmliu2/all.txt" -o raw_nodes.txt; then
            echo "错误：请求参考数据失败！"
            exit 1
          fi

          if [ ! -s raw_nodes.txt ]; then
            echo "错误：下载的内容为空！"
            exit 1
          fi

          NODE_COUNT=$(grep -c -E '[0-9a-zA-Z\.-]+:[0-9]+' raw_nodes.txt || true)
          
          echo "检查完毕，当前下载的文件中包含有效节点数量: $NODE_COUNT"

          if [ "$NODE_COUNT" -lt 3 ]; then
            echo "=========================================================="
            echo "❌ 警告：检测到有效节点数量 ($NODE_COUNT) 少于 3 个！"
            echo "为了保护原有数据不被污染，本次工作流将拒绝写入并强行终止！"
            echo "=========================================================="
            exit 1
          fi

          # 统一格式转换：来源 | 归属地 | IPv4/IPv6 | 运营商（过滤 127.0.0.1 占位）
          T=$(TZ='Asia/Shanghai' date +'%m-%d %H:%M')
          echo "162.159.198.1:443#CM优选 | ${T}" > cmliu2/all.txt
          awk -F'|' '{
            line=$0;
            if (line ~ /BestCF\.pages\.dev/) { next }
            split($1, a, "#"); ip_port=a[1];
            if (ip_port ~ /^127\.0\.0\.1/) { next }
            region=$2; gsub(/^ +| +$/, "", region); gsub(/^中国/, "", region);
            isp="未知";
            if (region ~ /电信/) isp="电信"
            else if (region ~ /移动|CMCC/) isp="移动"
            else if (region ~ /联通|CU/) isp="联通";
            if (region ~ /^CF / || region ~ /^CMCC/) region="未知";
            if (region == "小日本儿 JP") region="日本 JP";
            host=ip_port; sub(/^\[/, "", host); sub(/\]/, "", host); sub(/:[0-9]+$/, "", host);
            ipver=(host ~ /:/) ? "IPv6" : "IPv4";
            print ip_port "#CM优选 | " region " | " ipver " | " isp
          }' raw_nodes.txt >> cmliu2/all.txt
          echo "162.159.197.1:443#CM优选" >> cmliu2/all.txt
          
          echo "数据校验通过，all.txt 文件生成成功！"

      - name: 提交并推送文件
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # 核心改动：智能排除带有特定标志的动态广告/时间行进行增量比对
          HAS_CHANGES=false
          TARGET_FILE="cmliu2/all.txt"

          if [ -f "$TARGET_FILE" ] && git ls-files --error-unmatch "$TARGET_FILE" >/dev/null 2>&1; then
            echo "比对文本..."
            
            git show HEAD:"$TARGET_FILE" | sed '1d;$d' > old_clean.tmp || true
            sed '1d;$d' "$TARGET_FILE" > new_clean.tmp || true
            
            if diff -q old_clean.tmp new_clean.tmp >/dev/null 2>&1; then
              echo "优选未发生变化，跳过本次提交。"
              HAS_CHANGES=false
            else
              echo "检测到核心节点发生实质性更新！"
              HAS_CHANGES=true
            fi
            
            rm -f old_clean.tmp new_clean.tmp
          else
            echo "新文件或首次初始化，直接标记为有更新。"
            HAS_CHANGES=true
          fi

          if [ "$HAS_CHANGES" = true ]; then
            git add "$TARGET_FILE"
            git commit -m "cmliu2 $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')"
            git pull --rebase origin main
            git push
          fi